<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard Copilot</title>
<link rel="stylesheet" href="launcher.css">
<main>
  <h1>Taskboard Copilot</h1>
  <section id="connection" class="connection" role="status" aria-live="polite" data-state="loading">
    <strong><span data-connection-icon aria-hidden="true">…</span> <span data-connection-label>Checking Taskboard…</span></strong>
    <span data-connection-site></span>
    <p data-connection-detail></p>
    <button id="settings" type="button">Connect Taskboard</button>
  </section>
  <button id="split" class="mode" disabled><strong id="split-label">Split View</strong><span id="split-detail">Checking browser support…</span></button>
  <section id="split-instructions" class="instructions" hidden aria-live="polite">
    <strong id="split-step-title">One browser step is required</strong>
    <p id="capability"></p>
  </section>
  <button id="popup" class="mode" disabled><strong>Separate window</strong><span>Opens another browser window with remembered size.</span></button>
  <details><summary>Keyboard shortcut preference</summary>
  <label for="preferred">Keyboard shortcut opens</label>
  <select id="preferred" disabled><option value="split">Split View</option><option value="popup">Separate window</option></select>
  <p class="hint">Ctrl+Shift+Y · Change this key in your browser’s extension shortcuts.</p>
  </details>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="launcher.mjs"></script>
</html>
